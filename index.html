<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cadastro Elo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
:root{--navy:#0E2F6B;--purple:#6A0BB5;--violet:#800AD6;--bar2:#7A0CCB;--lilac:#D7B6FF;--bg:#fff;--surface:#F5F6FB;--line:#DFE2EE;--ink:#1E1E26;--muted:#5B6078;
--ok:#0F7B4E;--okbg:#E3F4EC;--err:#C0262D;--errbg:#FDECEC;--warn:#9A5B00;--warnbg:#FFF2DC;--font:"Montserrat",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0}[hidden]{display:none!important}
body{background:var(--surface);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.demo{background:var(--warnbg);color:var(--warn);font-size:14px;font-weight:700;text-align:center;padding:8px 16px}
header{background:linear-gradient(135deg,#0E2F6B 0%,#0E2F6B 35%,#4A12A0 72%,#800AD6 100%);color:#fff;padding-block:22px 64px;position:relative;overflow:hidden}
header:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:40px;background:var(--surface);clip-path:polygon(0 100%,100% 20%,100% 100%)}
header img{height:36px;display:block}
header h1{margin:20px 0 0;font-size:30px;line-height:1.1;font-weight:800;text-transform:uppercase}
header h1 span{color:var(--lilac)}
header p{margin:8px 0 0;font-weight:600;opacity:.92;font-size:16px}
main{padding-block:0 48px;margin-top:-30px;position:relative}
.box{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:16px;box-shadow:0 8px 24px rgba(14,47,107,.06)}
.box h2{margin:0 0 4px;font-size:19px;font-weight:800;color:var(--navy)}
.box .sub{margin:0 0 14px;color:var(--muted);font-size:15px}
.n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;font-size:15px;margin-right:10px;vertical-align:2px}
label{display:block;margin-top:16px}
label>b{display:block;font-weight:700;font-size:16px;color:var(--navy);margin-bottom:6px}
label>small{display:block;color:var(--muted);font-size:14px;margin-top:5px}
input,select{width:100%;height:56px;border:2px solid var(--line);border-radius:14px;padding:0 16px;background:#fff;font-size:18px}
input:focus,select:focus{border-color:var(--violet);outline:none;box-shadow:0 0 0 4px rgba(128,10,214,.15)}
.bad input,.bad select{border-color:var(--err);background:var(--errbg)}
.e{display:block;color:var(--err);font-weight:700;font-size:14px;margin-top:6px}
.e:empty{display:none}
.saved{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border-radius:14px;padding:14px 16px}
.saved b{color:var(--navy);display:block;font-size:17px}
.saved span{color:var(--muted);font-size:14px}
.link{border:0;background:none;color:var(--purple);font-weight:800;cursor:pointer;padding:8px;font-size:15px;text-decoration:underline}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ch{border:2.5px solid var(--line);background:#fff;border-radius:18px;padding:18px 12px;cursor:pointer;text-align:center;font-weight:800;color:var(--navy);font-size:17px;line-height:1.25}
.ch svg{display:block;margin:0 auto 10px;width:44px;height:44px;padding:9px;border-radius:14px;background:var(--surface);fill:none;stroke:var(--navy);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ch small{display:block;font-weight:600;color:var(--muted);font-size:13px;margin-top:4px}
.ch[aria-pressed="true"]{border-color:var(--bar2);background:#FBF8FF;color:var(--purple)}
.ch[aria-pressed="true"] svg{background:var(--bar2);stroke:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:15px}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.send{width:100%;height:62px;border:0;border-radius:16px;margin-top:22px;background:linear-gradient(90deg,#0E2F6B,#6A0BB5);color:#fff;font-weight:800;font-size:19px;cursor:pointer}
.send:disabled{opacity:.6;cursor:wait}
.note{border-radius:14px;padding:14px 16px;font-weight:700;font-size:15px;margin-top:14px}
.note.err{background:var(--errbg);color:var(--err)}
.note.warn{background:var(--warnbg);color:var(--warn)}
.done{text-align:center;padding:30px 22px}
.done .ic{width:84px;height:84px;border-radius:50%;margin:0 auto;background:var(--okbg);display:grid;place-items:center}
.done .ic svg{width:44px;height:44px;fill:none;stroke:var(--ok);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.done h2{font-size:24px;margin-top:16px}
.done p{color:var(--muted);margin:6px 0 0}
.done .who{font-weight:800;color:var(--navy);font-size:18px;margin-top:10px}
.done .again{display:grid;gap:10px;margin-top:22px}
.btn2{height:56px;border-radius:14px;font-weight:800;font-size:17px;cursor:pointer;border:2px solid var(--navy);background:#fff;color:var(--navy)}
.btn2.p{background:var(--navy);color:#fff}
.count{margin-top:16px;font-size:14px;color:var(--muted)}
.priv{font-size:13px;color:var(--muted);text-align:center;margin:14px 6px 0}
footer{display:flex;justify-content:center;align-items:center;gap:16px;padding-block:8px 36px}
footer img.g{height:30px}footer img.el{height:26px}footer i{width:1px;height:28px;background:var(--line)}
@media (max-width:420px){.choice{grid-template-columns:1fr 1fr}.ch{font-size:15px;padding:14px 8px}header h1{font-size:26px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="demo" id="demo" hidden>Modo de teste: os cadastros ainda não são gravados.</div>

  <h1>Cadastro <span>Elo</span></h1>
  <p>Preencha uma pessoa por vez. Leva menos de 1 minuto.</p>
</div></header>

<main class="wrap">
  <div id="form">
    <!-- 1. Sala -->
    <section class="box" id="bSala">
      <h2><span class="n">1</span>Sua sala</h2>
      <div id="salaEdit">
        <label id="lSala"><b>Qual é a sua sala?</b><select id="sala"></select><span class="e"></span></label>
        <label id="lQuem"><b>Seu nome</b><input id="quem" autocomplete="name" placeholder="Ex.: Maria Souza"><span class="e"></span></label>
      </div>
      <div class="saved" id="salaView" hidden><div><b id="vSala"></b><span id="vQuem"></span></div><button class="link" id="trocar" type="button">Trocar</button></div>
    </section>

    <!-- 2. Quem -->
    <section class="box">
      <h2><span class="n">2</span>Quem você vai cadastrar?</h2>
      <div class="choice" style="margin-top:14px">
        <button class="ch" type="button" id="cP" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 4l9 6.5V20H3z"/><path d="M9.5 20v-5h5v5"/></svg>Um parceiro<small>Restaurante, loja, passeio…</small></button>
        <button class="ch" type="button" id="cE" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1-3.6 3.8-5.5 7-5.5s6 1.9 7 5.5"/></svg>Alguém da equipe<small>Da sua sala</small></button>
      </div>
      <span class="e" id="eTipo"></span>
    </section>

    <!-- 3. Dados -->
    <section class="box" id="bDados" hidden>
      <h2><span class="n">3</span>Dados <span id="tDados"></span></h2>
      <label id="l_voucher" class="onlyP"><b>Nome do parceiro no voucher</b><input id="voucher" placeholder="Ex.: Caldinho do Neném"><small>Escreva igual aparece no TSE.</small><span class="e"></span></label>
      <label id="l_nome"><b id="bNome">Nome completo</b><input id="nome" autocomplete="off" placeholder="Ex.: José da Silva"><span class="e"></span></label>
      <label id="l_cpf"><b>CPF</b><input id="cpf" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00"><span class="e"></span></label>
      <label id="l_whats"><b>Celular (WhatsApp)</b><input id="whats" inputmode="tel" autocomplete="off" placeholder="(00) 00000-0000"><span class="e"></span></label>
      <label id="l_email"><b>E-mail</b><input id="email" type="email" inputmode="email" autocomplete="off" placeholder="Ex.: jose@gmail.com"><small>O acesso ao Elo chega neste e-mail.</small><span class="e"></span></label>
      <div class="onlyE" id="l_funcao" style="margin-top:16px"><b style="display:block;font-weight:700;color:var(--navy);margin-bottom:8px">O que essa pessoa faz?</b>
        <div class="chips" id="funcoes"></div><span class="e"></span></div>
      <input id="hp" name="site" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
      <div id="eSend"></div>
      <button class="send" id="send" type="button">Enviar cadastro</button>
      <p class="priv">Os dados são usados só para criar o acesso ao Elo.</p>
    </section>
  </div>

  <section class="box done" id="done" hidden>
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2>Cadastro enviado!</h2>
    <div class="who" id="dWho"></div>
    <p id="dTxt"></p>
    <div id="dDup"></div>
    <div class="again">
      <button class="btn2 p" id="maisP" type="button">Cadastrar outro parceiro</button>
      <button class="btn2" id="maisE" type="button">Cadastrar alguém da equipe</button>
    </div>
    <div class="count" id="count"></div>
  </section>

<script>
/* ========= CONFIGURAÇÃO =========
   Cole a URL do Apps Script (termina em /exec). */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyBPfR3X-qTZS8u19hh6VPMDP41zb4PSjIfoah9EsCBWx5hHVbkOlkSFxuQP_VRhCE/exec";
const SALAS = {
  "Pará · Salinas": ["Park Hotel","Beach Hotel"],
  "Goiás · Pirenópolis": ["Piryneus Hotel"],
  "Alagoas": ["Sala Gunga","Sala Francês","Sala Maragogi – Dia","Sala Maragogi – Noite"],
  "Rio Grande do Norte": ["Sala Pipa"],
  "Pernambuco": ["Sala Muro Alto","Sala Cupe","Porto Alto Hotel","Porto 2 Life Hotel","Sala Porto de Galinhas – Dia","Sala Porto de Galinhas – Noite"],
  "Ceará": ["Sala Lagoa do Paraíso","Sala Jericoacoara Villa"]
};
const FUNCOES = ["Supervisor","Analista","Assistente de contratos"];
/* ================================ */
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D=s=>String(s||'').replace(/\D/g,'');
const cpfOk=v=>{const c=D(v);if(c.length!==11||/^(\d)\1+$/.test(c))return false;for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=+c[i]*((t+1)-i);if(((s*10)%11)%10!==+c[t])return false}return true};
const mailOk=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v).trim());
const mCpf=v=>D(v).slice(0,11).replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');
const mTel=v=>{const d=D(v).slice(0,11);if(!d)return'';if(d.length<=2)return'('+d;if(d.length<=6)return`(${d.slice(0,2)}) ${d.slice(2)}`;if(d.length<=10)return`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;return`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`};
const get=k=>{try{return localStorage.getItem('elo.'+k)||''}catch(e){return''}};
const put=(k,v)=>{try{localStorage.setItem('elo.'+k,v)}catch(e){}};

if(!SCRIPT_URL)$('demo').hidden=false;

/* sala */
const SEL=$('sala');
SEL.innerHTML='<option value="">Escolha na lista</option>'+Object.entries(SALAS).map(([r,ss])=>`<optgroup label="${esc(r)}">${ss.map(s=>`<option value="${esc(r)}|${esc(s)}">${esc(s)}</option>`).join('')}</optgroup>`).join('');
function showSala(){const v=get('sala'),q=get('quem');const ok=v&&q;
  $('salaEdit').hidden=!!ok;$('salaView').hidden=!ok;
  if(ok){$('vSala').textContent=v.split('|')[1];$('vQuem').textContent='Enviando como '+q}
  else{SEL.value=v;$('quem').value=q}}
$('trocar').onclick=()=>{$('salaEdit').hidden=false;$('salaView').hidden=true;SEL.value=get('sala');$('quem').value=get('quem');SEL.focus()};
showSala();

/* tipo */
let tipo='',funcao='';
$('funcoes').innerHTML=FUNCOES.map(f=>`<button type="button" class="chip" aria-pressed="false" data-f="${esc(f)}">${esc(f)}</button>`).join('');
$('funcoes').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;funcao=b.dataset.f;[...$('funcoes').children].forEach(x=>x.setAttribute('aria-pressed',x===b));err('l_funcao','')};
function setTipo(t){tipo=t;$('cP').setAttribute('aria-pressed',t==='P');$('cE').setAttribute('aria-pressed',t==='E');$('eTipo').textContent='';
  $('bDados').hidden=false;document.querySelectorAll('.onlyP').forEach(x=>x.hidden=t!=='P');document.querySelectorAll('.onlyE').forEach(x=>x.hidden=t!=='E');
  $('tDados').textContent=t==='P'?'do parceiro':'da pessoa';$('bNome').textContent=t==='P'?'Nome do responsável pelo parceiro':'Nome completo';
  $('send').textContent=t==='P'?'Enviar cadastro do parceiro':'Enviar cadastro da pessoa';
  setTimeout(()=>$('bDados').scrollIntoView({behavior:'smooth',block:'start'}),50)}
$('cP').onclick=()=>setTipo('P');$('cE').onclick=()=>setTipo('E');

/* inputs */
$('cpf').addEventListener('input',e=>{e.target.value=mCpf(e.target.value);err('l_cpf','')});
$('whats').addEventListener('input',e=>{e.target.value=mTel(e.target.value);err('l_whats','')});
['voucher','nome','email'].forEach(k=>$(k).addEventListener('input',()=>err('l_'+k,'')));
$('quem').addEventListener('input',()=>err('lQuem',''));SEL.addEventListener('change',()=>err('lSala',''));
function err(id,msg){const l=$(id);if(!l)return;l.classList.toggle('bad',!!msg);const e=l.querySelector('.e');if(e)e.textContent=msg}

function validate(){const bad=[];
  const salaOpen=!$('salaEdit').hidden;
  if(salaOpen){
    if(!SEL.value){err('lSala','Escolha a sua sala.');bad.push('lSala')}
    if($('quem').value.trim().length<3){err('lQuem','Escreva o seu nome.');bad.push('lQuem')}
  }
  if(!tipo){$('eTipo').textContent='Escolha uma opção.';bad.push('eTipo')}
  if(tipo==='P'&&!$('voucher').value.trim()){err('l_voucher','Escreva o nome do parceiro como está no TSE.');bad.push('l_voucher')}
  const nm=$('nome').value.trim();if(nm.split(/\s+/).length<2){err('l_nome','Escreva nome e sobrenome.');bad.push('l_nome')}
  if(!cpfOk($('cpf').value)){err('l_cpf',D($('cpf').value).length<11?'O CPF tem 11 números.':'Este CPF não existe. Confira os números.');bad.push('l_cpf')}
  const t=D($('whats').value);if(t.length<10){err('l_whats','Coloque o DDD e o número.');bad.push('l_whats')}
  if(!mailOk($('email').value)){err('l_email','Confira o e-mail. Ex.: nome@gmail.com');bad.push('l_email')}
  if(tipo==='E'&&!funcao){err('l_funcao','Escolha uma opção.');bad.push('l_funcao')}
  if(bad.length){const el=$(bad[0]);el.scrollIntoView({behavior:'smooth',block:'center'});const i=el.querySelector&&el.querySelector('input,select');i&&setTimeout(()=>i.focus(),300)}
  return !bad.length}

$('send').onclick=async()=>{
  $('eSend').innerHTML='';if(!validate())return;
  if(!$('salaEdit').hidden){put('sala',SEL.value);put('quem',$('quem').value.trim())}
  const [regiao,sala]=get('sala').split('|');
  const pessoa={nome:$('nome').value.trim(),cpf:$('cpf').value,email:$('email').value.trim(),whats:$('whats').value};
  const payload={hp:$('hp').value,ident:{nome:get('quem'),regiao,sala},
    parceiros:tipo==='P'?[{...pessoa,voucher:$('voucher').value.trim()}]:[],
    equipe:tipo==='E'?[{...pessoa,funcao}]:[]};
  const b=$('send');const txt=b.textContent;b.disabled=true;b.textContent='Enviando…';
  try{let res;
    if(!SCRIPT_URL){await new Promise(r=>setTimeout(r,600));res={ok:true,gravados:1,duplicados:[]}}
    else{const r=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify(payload)});res=await r.json()}
    if(!res.ok)throw new Error(res.erro||'erro');
    const n=(+get('n')||0)+1;put('n',String(n));
    $('dWho').textContent=tipo==='P'?$('voucher').value.trim():pessoa.nome;
    $('dTxt').textContent=`Enviado para a equipe Elo · ${sala}`;
    $('dDup').innerHTML=res.duplicados&&res.duplicados.length?'<div class="note warn">Este CPF já tinha sido enviado antes. A equipe Elo vai conferir.</div>':'';
    $('count').textContent=`Você já enviou ${n} cadastro${n>1?'s':''} neste aparelho.`;
    $('form').hidden=true;$('done').hidden=false;window.scrollTo({top:0,behavior:'smooth'});
  }catch(e){
    const m=String(e.message||'');
    $('eSend').innerHTML='<div class="note err">Não foi possível enviar agora. Confira a internet e toque em enviar de novo.</div>';
  }finally{b.disabled=false;b.textContent=txt}
};

function reset(t){['voucher','nome','cpf','whats','email'].forEach(k=>{$(k).value='';err('l_'+k,'')});funcao='';[...$('funcoes').children].forEach(x=>x.setAttribute('aria-pressed','false'));
  $('done').hidden=true;$('form').hidden=false;showSala();setTipo(t);setTimeout(()=>$(t==='P'?'voucher':'nome').focus(),400)}
$('maisP').onclick=()=>reset('P');$('maisE').onclick=()=>reset('E');
})();
</script>
</body>
</html>
